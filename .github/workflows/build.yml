name: Build Minimal and Compressed Sing-Box

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (例如: v1.11.3-min)'
        required: true
        default: 'v1.11.3-min'

jobs:
  build-compressed:
    name: Build Ultra-Small Sing-Box
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: v1.11.3
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install UPX Packer
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl

      - name: Build and Compress (Linux AMD64 / ARM64)
        run: |
          mkdir -p build_output

          # ---------------------------------------------------------
          # 如果你的路由器是 x86_64 (AMD64)，保留这段：
          # ---------------------------------------------------------
          echo "Building for Linux amd64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -v -trimpath \
            -tags "with_quic,with_utls,with_hysteria,with_tuic" \
            -ldflags "-s -w -buildid=" \
            -o build_output/sing-box-amd64 ./cmd/sing-box
          
          # 使用 UPX 进行终极极限压缩（减小二进制磁盘体积）
          upx --best --lzma build_output/sing-box-amd64

          # ---------------------------------------------------------
          # 如果你的路由器是 ARM64 (如 armv8 / N1盒子 / 各种Armbian盒子)，取消下面几行的注释：
          # ---------------------------------------------------------
          # echo "Building for Linux arm64..."
          # CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -v -trimpath \
          #   -tags "with_quic,with_utls,with_hysteria,with_tuic" \
          #   -ldflags "-s -w -buildid=" \
          #   -o build_output/sing-box-arm64 ./cmd/sing-box
          # upx --best --lzma build_output/sing-box-arm64

          # 打包成压缩包方便下载
          cd build_output
          tar -czvf "sing-box-${{ github.event.inputs.tag_name }}-linux-amd64.tar.gz" sing-box-amd64
          # 如果编译了 arm64，也打包一个：
          # tar -czvf "sing-box-${{ github.event.inputs.tag_name }}-linux-arm64.tar.gz" sing-box-arm64
          cd ..

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: Sing-Box Ultra-Light (${{ github.event.inputs.tag_name }})
          body: |
            Ultra-compressed minimal build of **Sing-Box v1.11.3** for routers.
            - Protocols: **Hysteria 2**, **TUIC** only.
            - Stripped symbols (`-s -w`) & packed with **UPX `--best --lzma`** for minimum file size.
          files: build_output/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
